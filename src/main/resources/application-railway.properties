# ─── Railway deployment profile ──────────────────────────────────────────────
# SPRING_PROFILES_ACTIVE=railway
# Railway PostgreSQL plugin injects: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# Railway Redis plugin injects: REDIS_URL
# ─────────────────────────────────────────────────────────────────────────────

# --- Server port (Railway injects PORT dynamically) ---
server.port=${PORT:8080}

# --- Database (Railway PostgreSQL plugin) ---
# PGHOST/PGPORT/PGDATABASE injected by Railway; DB_USERNAME/DB_PASSWORD are for the
# DML-only app user (cfapp) created by V58 migration. PGUSER/PGPASSWORD remain as
# the DDL admin user used only by Flyway.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# HikariCP (Railway free tier resource constraints)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Flyway ---
# Flyway runs as the DDL admin user (FLYWAY_DB_USERNAME = PGUSER).
# migration-railway contains Railway-only SQL (e.g. CREATE ROLE) incompatible with H2.
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration,classpath:db/migration-railway
spring.flyway.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.flyway.user=${FLYWAY_DB_USERNAME}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.flyway.placeholders.app-db-password=${DB_PASSWORD}

# --- Redis (Railway Redis plugin) ---
# Railway injects REDIS_URL as redis://default:pass@host:port
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# --- JWT ---
jwt.secret=${JWT_SECRET}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- AWS S3 + SES (desabilitado; habilite com aws.enabled=true e configure as variáveis) ---
aws.enabled=false

# --- App URL ---
app.url=${APP_URL}

# --- MercadoPago ---
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.success-url=${APP_URL}/settings/billing/success
mercadopago.failure-url=${APP_URL}/settings/billing/failure
mercadopago.pending-url=${APP_URL}/settings/billing/pending

# --- RabbitMQ desabilitado no Railway (sem plugin) ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.consultafacil=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=INFO

# --- Swagger desabilitado em prod ---
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.observations.key-values.application=${spring.application.name}
management.observations.key-values.environment=railway
management.health.rabbit.enabled=false
management.health.redis.enabled=false

# --- Tracing desabilitado (sem Grafana no Railway free tier) ---
management.tracing.enabled=false
