plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springdoc.openapi-gradle-plugin' version '2.1.0'
	id 'jacoco'
}

group = 'com.consultafacil'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Rate limiting
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.21.0'

	// Database
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	
	// OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'
	
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	
	// Dev tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	
	// Faker for data generation
	implementation('com.github.javafaker:javafaker:1.0.2') { exclude group: 'org.yaml', module: 'snakeyaml' }
        implementation 'org.yaml:snakeyaml:2.2'

	// Observability — Metrics
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Observability — Distributed Tracing (Micrometer + OTEL bridge)
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

	// Observability — Structured JSON logging (stdout → CloudWatch on ECS)
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

	// Cache — Redis
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// AWS SDK
	implementation platform('software.amazon.awssdk:bom:2.57.8')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sesv2'

	// MercadoPago
	implementation('com.mercadopago:sdk-java:2.1.7') {
		exclude group: 'org.sonatype.sisu', module: 'sisu-guice'
	}
	
	// H2 para geração do OpenAPI spec sem PostgreSQL
	implementation 'com.h2database:h2'

	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'com.h2database:h2'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-rabbitmq'
	testImplementation 'org.springframework.amqp:spring-rabbit-test'
}

// ─── JaCoCo: cobertura de testes ─────────────────────────────────────────────
jacoco {
	toolVersion = '0.8.12'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	// Use system temp dir for binary results to avoid Windows file-lock conflicts from IDE indexers
	binaryResultsDirectory.set(new File(System.getProperty("java.io.tmpdir"), "gradle-test-binary-consultafacil"))
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'com/consultafacil/demo/**',
				'**/dto/**',
				'**/config/**',
				'**/seeder/**',
			])
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value   = 'COVEREDRATIO'
				minimum = 0.60
			}
		}
		rule {
			limit {
				counter = 'INSTRUCTION'
				value   = 'COVEREDRATIO'
				minimum = 0.60
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'com/consultafacil/demo/**',
				'**/dto/**',
				'**/config/**',
				'**/seeder/**',
			])
		}))
	}
}

// ─── Git hooks: instala pre-commit (rápido) e pre-push (suíte completa) ──────
tasks.register('installGitHooks', Copy) {
	description = 'Copia scripts/pre-commit e scripts/pre-push para .git/hooks/'
	group       = 'setup'
	from(new File(rootDir, 'scripts')) {
		include 'pre-commit', 'pre-push'
	}
	into('.git/hooks')
	filePermissions { unix(0755) }
	doLast {
		logger.lifecycle('✓ Git hooks instalados em .git/hooks/')
	}
}

// Roda o instalador de hooks a cada build
build.dependsOn installGitHooks

// Gera openapi.json sem precisar do PostgreSQL (usa H2 in-memory via perfil 'openapi')
openApi {
	apiDocsUrl = 'http://localhost:8080/v1/docs'
	outputDir = file("${buildDir}/openapi")
	outputFileName = 'openapi.json'
	waitTimeInSeconds = 30
	customBootRun {
		args = ['--spring.profiles.active=openapi']
	}
}

// Copia openapi.json gerado para o projeto web após a geração
tasks.named('generateOpenApiDocs') {
	doLast {
		copy {
			from file("${buildDir}/openapi/openapi.json")
			into file("${projectDir}/../web")
		}
	}
}

